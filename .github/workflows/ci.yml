name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-linux:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      # The app-server transport tests use a local Python JSON-RPC fixture.
      # swift:6.1 ships libpython, but not the Python interpreter.
      - name: Install test fixture runtime
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Check test fixture runtime
        run: python3 --version
      - run: swift test

  apps-macos:
    name: Build Mac + iPhone apps
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: make test
      - run: make mac
      - run: make phone
