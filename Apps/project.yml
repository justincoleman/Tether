name: Tether
options:
  bundleIdPrefix: com.justincoleman
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  TetherPackage:
    path: ..
  libghostty-spm:
    url: https://github.com/Lakr233/libghostty-spm.git
    from: "2.2.0"
targets:
  Tether:
    type: application
    platform: macOS
    sources: [Tether, Shared]
    dependencies:
      - package: TetherPackage
        product: TetherCore
      - package: TetherPackage
        product: TetherProtocol
      - package: libghostty-spm
        product: GhosttyTerminal
    info:
      path: Tether/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tether
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleIconName: AppIcon
        CFBundleIconFile: Tether
        NSHumanReadableCopyright: ""
    entitlements:
      path: Tether/Resources/Tether.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.server: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justincoleman.tether
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TetherPhone:
    type: application
    platform: iOS
    sources: [TetherPhone, Shared, PhoneShared]
    dependencies:
      - package: TetherPackage
        product: TetherProtocol
      - target: TetherWidgets
    entitlements:
      path: TetherPhone/Resources/TetherPhone.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: TetherPhone/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tether
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Tether scans a QR code shown by your Mac to pair.
        NSLocalNetworkUsageDescription: Tether connects to Tether on your Mac over Tailscale.
        CFBundleURLTypes:
          - CFBundleURLName: com.justincoleman.tether.pair
            CFBundleURLSchemes: [tether]
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justincoleman.tether.phone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TetherWidgets:
    type: app-extension
    platform: iOS
    sources: [TetherWidgets, PhoneShared]
    dependencies:
      - package: TetherPackage
        product: TetherProtocol
    info:
      path: TetherWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tether
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justincoleman.tether.phone.widgets
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Tether:
    build:
      targets: { Tether: all }
    run:
      config: Debug
  TetherPhone:
    build:
      targets: { TetherPhone: all }
    run:
      config: Debug
